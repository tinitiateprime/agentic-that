name: Publishing Companion Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/publishing-companion-desktop/package-lock.json

      - name: Install website dependencies
        run: npm ci

      - name: Install desktop dependencies
        run: npm ci --prefix apps/publishing-companion-desktop

      - name: Verify application and Companion contracts
        run: |
          npm run test:publishing
          npm run test:instagram
          npm run test:facebook
          npm run build

      - name: Verify release tag matches Companion version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath "apps/publishing-companion-desktop/package.json" -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Release tag $env:GITHUB_REF_NAME must exactly match Companion version v$version."
          }

      - name: Configure Windows code signing
        shell: pwsh
        env:
          SIGNING_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_CERTIFICATE)) {
            Write-Warning "No signing certificate configured; producing unsigned release artifacts. Windows may show a SmartScreen warning."
            exit 0
          }
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_PASSWORD)) {
            throw "WINDOWS_CERTIFICATE_PASSWORD is required when WINDOWS_CERTIFICATE_BASE64 is configured."
          }
          $certificatePath = Join-Path $env:RUNNER_TEMP "agenticthat-companion-signing.pfx"
          [System.IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:SIGNING_CERTIFICATE))
          "WINDOWS_CERTIFICATE_FILE=$certificatePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "WINDOWS_CERTIFICATE_PASSWORD=$env:SIGNING_PASSWORD" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "WINDOWS_RELEASE_SIGNED=true" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build Companion installer and portable package
        run: |
          npm run publishing:brand-assets
          npm --prefix apps/publishing-companion-desktop run make

      - name: Validate and package optional Companion extension
        run: |
          npm run publishing:extension:validate
          npm run publishing:extension:package

      - name: Collect Companion release artifacts
        shell: pwsh
        run: ./scripts/collect-publishing-release-artifacts.ps1

      - name: Verify installer signature when configured
        if: env.WINDOWS_RELEASE_SIGNED == 'true'
        shell: pwsh
        run: |
          $signature = Get-AuthenticodeSignature -LiteralPath "artifacts/AgenticThat-Publishing-Companion-Setup.exe"
          if ($signature.Status -ne "Valid") { throw "The production Companion installer signature is $($signature.Status)." }

      - name: Smoke-test packaged Companion
        shell: pwsh
        run: npm run publishing:desktop:smoke

      - name: Create SHA-256 checksums
        shell: pwsh
        run: |
          Get-ChildItem -LiteralPath "artifacts" -File |
            Sort-Object Name |
            ForEach-Object { "{0}  {1}" -f (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLowerInvariant(), $_.Name } |
            Set-Content -LiteralPath "artifacts/SHA256SUMS.txt" -Encoding ascii

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: agenticthat-companion-release
          path: artifacts/*
          if-no-files-found: error

      - name: Publish tagged GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releaseArguments = @(
            "release", "create", $env:GITHUB_REF_NAME,
            "--verify-tag", "--generate-notes",
            "--title", "AgenticThat Companion $env:GITHUB_REF_NAME"
          )
          $releaseArguments += (Get-ChildItem -LiteralPath "artifacts" -File | ForEach-Object { $_.FullName })
          & gh @releaseArguments
