name: Publishing Companion Release

on:
  workflow_dispatch:
  push:
    tags:
      - "publishing-v*"

permissions:
  contents: write

jobs:
  portable-release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/publishing-companion-desktop/package-lock.json

      - name: Install website dependencies
        run: npm ci

      - name: Install desktop dependencies
        run: npm ci --prefix apps/publishing-companion-desktop

      - name: Build unsigned portable Companion
        run: |
          npm run publishing:brand-assets
          npm --prefix apps/publishing-companion-desktop run make

      - name: Validate and package optional Companion extension
        run: |
          npm run publishing:extension:validate
          npm run publishing:extension:package

      - name: Collect Companion release artifacts
        shell: pwsh
        run: ./scripts/collect-publishing-release-artifacts.ps1 -PortableOnly

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: agenticthat-companion-release
          path: artifacts/*
          if-no-files-found: error

      - name: Publish tagged GitHub release
        if: startsWith(github.ref, 'refs/tags/publishing-v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releaseArguments = @(
            "release", "create", $env:GITHUB_REF_NAME,
            "--verify-tag", "--generate-notes",
            "--title", "AgenticThat Companion $env:GITHUB_REF_NAME"
          )
          $releaseArguments += (Get-ChildItem -LiteralPath "artifacts" -File | ForEach-Object { $_.FullName })
          & gh @releaseArguments
