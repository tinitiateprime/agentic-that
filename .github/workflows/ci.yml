name: Continuous Integration

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/publishing-companion-desktop/package-lock.json
            services/messaging/telegram/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix apps/publishing-companion-desktop
          npm ci --prefix services/messaging/telegram

      - name: Verify application and Companion contracts
        run: |
          npm run test:all
          npm run publishing:extension:validate
          node scripts/build-publishing-companion-runtime.mjs
          npm run build
          npm run aws:worker:build
