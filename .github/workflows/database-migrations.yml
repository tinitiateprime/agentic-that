name: Production Database Migrations

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type MIGRATE_PRODUCTION to apply pending migrations
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-database-migrations
  cancel-in-progress: false

jobs:
  migrate:
    if: inputs.confirm == 'MIGRATE_PRODUCTION'
    runs-on: ubuntu-latest
    environment: production-database
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply and verify migrations
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          PLATFORM_SUPER_ADMIN_EMAILS: ${{ vars.PLATFORM_SUPER_ADMIN_EMAILS }}
          RUN_DATABASE_MIGRATIONS: "true"
          NODE_ENV: production
        run: npm run db:migrate && npm run db:verify-security
