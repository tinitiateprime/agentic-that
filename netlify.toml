[build]
  command = "npm run build"
  publish = ".next"
  functions = "netlify/functions"

[build.environment]
  DATA_STORE = "netlify-blobs"
  NEXT_DIST_DIR = ".next"
  NPM_FLAGS = "--include=dev"
  NODE_VERSION = "22"
  # These values are public routing/configuration identifiers, not credentials.
  # Tokens, app secrets, passwords, encryption keys, and database URLs remain scanned.
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_TELEGRAM_DASHBOARD_URL,NEXT_PUBLIC_WHATSAPP_DASHBOARD_URL,WA_PROVIDER,META_API_VERSION,WA_FROM,META_PHONE_NUMBER_ID,META_WABA_ID,META_APP_ID,META_CONFIGURATION_ID"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[functions.instagram]
  node_bundler = "esbuild"
  external_node_modules = ["@sparticuz/chromium", "playwright-core", "sharp"]
  included_files = ["node_modules/@sparticuz/chromium/bin/**"]

[functions.instagram-background]
  node_bundler = "esbuild"
  external_node_modules = ["@sparticuz/chromium", "playwright-core", "sharp"]
  included_files = ["node_modules/@sparticuz/chromium/bin/**"]

[functions.growth-advisor-background]
  node_bundler = "esbuild"

[[redirects]]
  from = "/console"
  to = "/console/index.html"
  status = 200

[[redirects]]
  from = "/console/*"
  to = "/console/:splat"
  status = 200
