# Place the limit zone inside Nginx's http block (normally this file is included there).
limit_req_zone $binary_remote_addr zone=agenticthat_automation:10m rate=30r/s;

server {
    listen 443 ssl http2;
    server_name worker-staging.example.com;

    # Replace these with the certificate paths created for the staging worker domain.
    ssl_certificate /etc/letsencrypt/live/worker-staging.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/worker-staging.example.com/privkey.pem;

    client_max_body_size 26m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location = / {
        return 404;
    }

    location ^~ /development/ {
        return 404;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8800/health;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /ready {
        proxy_pass http://127.0.0.1:8800/ready;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /v1/ {
        limit_req zone=agenticthat_automation burst=60 nodelay;
        proxy_pass http://127.0.0.1:8800;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
}
